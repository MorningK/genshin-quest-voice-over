[project]
name = "genshin-quest-voice-over"
version = "0.1.0"
description = "Genshin Impact quest dialogue voice-over generation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
]

[project.optional-dependencies]
# 屏幕捕获后端
capture = [
    "dxcam>=0.0.6",
    "mss>=9.0.1",
]
# OCR 首选：PaddleOCR
ocr = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
]
# OCR 备选：RapidOCR（ONNX 轻量版）
ocr-rapid = [
    "onnxruntime>=1.28.0",
    "rapidocr>=3.9.2",
]
# TTS 在线默认：Edge TTS
tts-online = [
    "edge-tts>=6.1.0",
]
# TTS 离线备选：VITS（仅骨架，需额外模型与推理依赖）
tts-offline = []
playback = [
    "miniaudio>=1.71",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.2.0",
    "ruff>=0.15.14",
]

# ============================================
# Ruff 配置 — 代码格式化和静态检查
# ============================================
[tool.ruff]
# 目标 Python 版本
target-version = "py312"
# 代码行宽
line-length = 120

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import 排序)
    "N",     # pep8-naming (命名规范)
    "UP",    # pyupgrade (语法现代化)
    "B",     # flake8-bugbear (常见 bug 检查)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify (简化代码)
    "TCH",   # flake8-type-checking (类型检查导入)
]
# 忽略的规则
ignore = [
    "E501",  # 行长度由 formatter 处理
    "B008",  # 允许在函数参数中直接调用
]

[tool.ruff.format]
# 使用单引号还是双引号
quote-style = "double"
# 缩进风格
indent-style = "space"
# 在代码嵌套表达式中，是否添加额外的括号来消除运算符优先级歧义
skip-magic-trailing-comma = false

# ============================================
# Pyrefly 配置 — 类型检查
# ============================================
[tool.pyrefly]
# 要类型检查的源码
project-includes = ["src"]
# 以项目根目录为导入根，使 `src` 成为顶层包，
# 从而正确解析 `from src.xxx import ...` 这类导入
search-path = ["."]
# 虚拟环境中的第三方包路径，用于 IDE 语言服务器解析已安装依赖（如 numpy）。
# 命令行 pyrefly 可从解释器自动获取，但 IDE 语言服务器依赖此显式配置。
site-package-path = [".venv/lib/site-packages"]
# 目标 Python 版本
python-version = "3.12"
