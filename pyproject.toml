[project]
name = "genshin-quest-voice-over"
version = "0.1.0"
description = "Real-time voice-over for unvoiced Genshin Impact quests: screen capture → OCR → TTS"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kui Chen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# 基础运行依赖：含 Web 服务（FastAPI+SSE）与 OCR/TTS 引擎运行时。
# 说明：Web 服务（server.py）需在 Vercel 上运行，Vercel 仅安装 [project].dependencies
#       中的依赖（不安装可选组），故将 Web/OCR/TTS 运行时依赖全部置于此处，
#       以确保 Vercel 原生打包时能正确装入并随函数 bundle 分发。
# 注意：fastapi / python-multipart 虽仅 Web 端使用，但属于 Vercel 部署的硬需求，
#       不得移入 web 可选组，否则线上服务会 ModuleNotFoundError。
dependencies = [
    # 图像处理与 OCR（RapidOCR，默认后端）
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "rapidocr>=3.9.2",
    "opencv-python-headless>=4.10.0",
    # 流式 TTS（Edge TTS，默认后端）
    "edge-tts>=6.1.0",
    # Web 服务（FastAPI + SSE）
    "fastapi>=0.115.0",
    "python-multipart>=0.0.30",
]

[project.urls]
Homepage = "https://github.com/MorningK/genshin-quest-voice-over"
Repository = "https://github.com/MorningK/genshin-quest-voice-over"
Issues = "https://github.com/MorningK/genshin-quest-voice-over/issues"

# PyPI 发行包只提供命令行入口；桌面 GUI 随打包的 exe 分发，不进 wheel。
# 长短两个命令指向同一入口，方便记忆与补全。
[project.scripts]
gqvo = "genshin_voice_over.cli:main"
genshin-quest-voice-over = "genshin_voice_over.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src-layout：包根位于 src/genshin_voice_over；gui 子包仅供 PyInstaller 打包 exe，
# 依赖 CustomTkinter 等桌面组件，不随 PyPI 发行包分发。
[tool.hatch.build.targets.wheel]
packages = ["src/genshin_voice_over"]
exclude = ["src/genshin_voice_over/gui"]

[tool.hatch.build.targets.sdist]
include = ["src/genshin_voice_over", "README.md", "LICENSE", "main.py", "pyproject.toml"]

[project.optional-dependencies]
# 屏幕捕获后端
capture = [
    "dxcam>=0.0.6",
    "mss>=9.0.1",
]
# OCR 首选：PaddleOCR
ocr = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
]
# OCR 备选：RapidOCR（ONNX 轻量版）
ocr-rapid = [
    "onnxruntime>=1.28.0",
    "rapidocr>=3.9.2",
]
# OCR GPU（RapidOCR）：与 ocr-rapid 组互斥，启用 GPU 时替代 ocr-rapid 组
# 说明：PaddleOCR 的 GPU 版（paddlepaddle-gpu 3.x）仅发布在 Paddle 官方源，
#       无法作为常规 PyPI 依赖，需按 README 从官方源单独安装。
ocr-rapid-gpu = [
    "onnxruntime-gpu>=1.28.0",
    "rapidocr>=3.9.2",
]
# TTS 在线默认：Edge TTS
tts-online = [
    "edge-tts>=6.1.0",
]
# TTS 离线备选：VITS（仅骨架，需额外模型与推理依赖）
tts-offline = []
# OCR 预处理：图像增强与字幕区域聚焦（缺依赖时自动降级，不影响既有行为）
ocr-preprocess = [
    "opencv-python-headless>=4.10.0",
]
playback = [
    "miniaudio>=1.71",
]
# Web 服务（FastAPI + SSE）：图片 OCR 识别 + 流式 TTS 语音合成
# 说明：fastapi / python-multipart 为 Vercel 运行时必需，已置于 [project].dependencies；
#       uvicorn 仅本地开发运行 server.py 时使用，故单独作为可选依赖，避免打包进 Vercel 函数。
web = [
    "uvicorn>=0.30.0",
]
gui = [
    "customtkinter>=6.0.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.2",
]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.2.0",
    "ruff>=0.15.14",
]

# ============================================
# Vercel 部署配置 — FastAPI 入口
# ============================================
[tool.vercel]
# 声明 FastAPI 实例入口：在 ./server.py 中查找名为 `app` 的应用
entrypoint = "server:app"

# ============================================
# uv 配置 — 可选依赖组互斥声明
# ============================================
[tool.uv]
# onnxruntime（CPU）与 onnxruntime-gpu（GPU）共享包名，二者互斥，不可同时激活
conflicts = [
    [{ extra = "ocr-rapid" }, { extra = "ocr-rapid-gpu" }],
]

# rapidocr 硬依赖 opencv-python（GUI 版），其需要 libxcb/libGL 等 X11 系统库，
# 在 Vercel 等无显示环境的 serverless 上会因缺 libxcb.so.1 而导入失败。
# 这里全局排除 GUI 版 opencv-python，改用基础依赖中的 opencv-python-headless
# （无 GUI/X11 依赖）提供 cv2，满足 rapidocr 的运行需求。
# 注意：使用字符串形式（PEP 508），兼容 Vercel 构建用的 uv 0.10.x；
#       对象形式（{ package = ... }）是 uv 0.11+ 才支持的语法，旧版会解析失败。
exclude-dependencies = [
    "opencv-python",
]

# ============================================
# Ruff 配置 — 代码格式化和静态检查
# ============================================
[tool.ruff]
# 目标 Python 版本
target-version = "py312"
# 代码行宽
line-length = 120
# 源码根目录：src-layout 下让 isort 把 genshin_voice_over 识别为第一方包
src = ["src", "."]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import 排序)
    "N",     # pep8-naming (命名规范)
    "UP",    # pyupgrade (语法现代化)
    "B",     # flake8-bugbear (常见 bug 检查)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify (简化代码)
    "TCH",   # flake8-type-checking (类型检查导入)
]
# 忽略的规则
ignore = [
    "E501",  # 行长度由 formatter 处理
    "B008",  # 允许在函数参数中直接调用
]

[tool.ruff.format]
# 使用单引号还是双引号
quote-style = "double"
# 缩进风格
indent-style = "space"
# 在代码嵌套表达式中，是否添加额外的括号来消除运算符优先级歧义
skip-magic-trailing-comma = false

# ============================================
# Pyrefly 配置 — 类型检查
# ============================================
[tool.pyrefly]
# 要类型检查的源码
project-includes = ["src"]
# src-layout：以 src/ 为导入根，使 `genshin_voice_over` 成为顶层包，
# 从而正确解析 `from genshin_voice_over.xxx import ...` 这类导入
search-path = ["src"]
# 虚拟环境中的第三方包路径，用于 IDE 语言服务器解析已安装依赖（如 numpy）。
# 命令行 pyrefly 可从解释器自动获取，但 IDE 语言服务器依赖此显式配置。
site-package-path = [".venv/lib/site-packages"]
# 目标 Python 版本
python-version = "3.12"
